default_provider = "age"

[daemon]
enabled = true
idle_timeout = "8h"

[providers.age]
type = "age"
recipients = ["age1j6seutd0m7k2kwrx5udqzs7fdr76x272ysxw3dutcr2s70vvnqmq4uylrw"]

[secrets]
ELEVENLABS_API_KEY= { provider = "age", value = "" }
EPIDEMIC_SOUND_API_KEY= { provider = "age", value = "" }
GEMINI_API_KEY= { provider = "age", value = "" }
ATUIN_SYNC_ADDRESS= { provider = "age", value = "", description = "atuin sync server (tailnet-only)" }

[profiles]

[profiles.atuin]

[profiles.atuin.secrets]
ATUIN_PASSWORD= { provider = "age", value = "", description = "atuin account password (dpoblador)" }
