# Dev-only tools, loaded when MISE_ENV=dev (macs; see .zshenv)
[tools]
awscli = "latest"
claude = "latest"
copilot-cli = "latest"
gemini-cli = "latest"
opencode = "latest"
fnox = "latest"
pi = "latest"
gcloud = "latest"
"npm:cf" = "latest"
rust = "latest"
mongosh = "latest"
ty = "latest"
ruff = "latest"
prek = "latest"
actionlint = "latest"
age = "latest"
sentry-cli = "latest"
stripe = "latest"
vhs = "latest"
"ubi:resend/resend-cli" = "latest"
# Monorepo: the bare 0.3.x tags sort after the current vacant-v* ones, so
# without the filter "latest" resolves backwards to 0.3.4.
"ubi:alltuner/vacant[tag_regex=^vacant-v]" = "latest"
"github:alltuner/mise-completions-sync" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
rust-analyzer = "latest"
zig = "latest"
