# Dev-only tools, loaded when MISE_ENV=dev (macs; see .zshenv)
[tools]
awscli = "latest"
claude = "latest"
copilot-cli = "latest"
gemini-cli = "latest"
opencode = "latest"
fnox = "latest"
pi = "latest"
gcloud = "latest"
"npm:cf" = "latest"
rust = "latest"
mongosh = "latest"
ty = "latest"
ruff = "latest"
prek = "latest"
actionlint = "latest"
age = "latest"
sentry-cli = "latest"
stripe = "latest"
vhs = "latest"
"github:resend/resend-cli" = "latest"
# Monorepo: the vacant-py-* and vacant-js-* tags carry no binaries, so without
# the prefix "latest" resolves to a release with no macOS asset.
"github:alltuner/vacant[version_prefix=vacant-v]" = "latest"
"github:alltuner/mise-completions-sync" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
rust-analyzer = "latest"
zig = "latest"
