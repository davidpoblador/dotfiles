# Dev-only tools, loaded when MISE_ENV=dev (macs; see .zshenv)
[tools]
awscli = "latest"
claude = "latest"
copilot-cli = "latest"
# The registry alias resolves to the same package, but installing under that
# name makes mise run node-pty's node-gyp build script, which has no
# toolchain here. The npm-qualified name uses the prebuilt binary instead.
"npm:@google/gemini-cli" = "latest"
opencode = "latest"
fnox = "latest"
pi = "latest"
gcloud = "latest"
# mise leaves prereleases out of both "latest" and prefix matching, so only an
# exact version selects a beta; Renovate bumps it (see renovate.json).
"npm:cf" = "1.0.0-rc.6"
# Browse: MCP server + relay for the agent browser (Helium); see TOOLS.md.
# The native binary straight from npm's darwin-arm64 package: @opencode/browse
# itself is a Node launcher for it, which every agent session would run. npm's
# publish dates keep mise's release-age wait in force.
"http:browse" = { version = "latest", url = "https://registry.npmjs.org/@opencode/browse-darwin-arm64/-/browse-darwin-arm64-{{version}}.tgz", strip_components = 1, bin_path = "bin", version_list_url = "https://registry.npmjs.org/@opencode/browse-darwin-arm64", version_expr = "keys(fromJSON(body).versions) | sortVersions()", version_date_expr = "fromJSON(body).time" }
# chrome-devtools CLI: DevTools on Helium on demand, one shared daemon; see TOOLS.md.
"npm:chrome-devtools-mcp" = "latest"
rust = "latest"
mongosh = "latest"
ty = "latest"
ruff = "latest"
prek = "latest"
actionlint = "latest"
age = "latest"
sentry-cli = "latest"
stripe = "latest"
vhs = "latest"
# The archive ships the binary as `resend`, not as the repo name. exe is a ubi
# option; the github backend spells it bin, and rejects unknown options.
"github:resend/resend-cli[bin=resend]" = "latest"
# Monorepo: the -js/-py tags carry no binaries and the bare 0.3.x tags sort
# after the current ones, so "latest" needs the prefix filter. tag_regex is a
# ubi option; the github backend spells it version_prefix.
"github:alltuner/vacant[version_prefix=vacant-v]" = "latest"
"github:alltuner/mise-completions-sync" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
rust-analyzer = "latest"
zig = "latest"
