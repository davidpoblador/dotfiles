# Syncs with the self-hosted server (garrisson stack on durian, tailnet-only).
# Its address is private, so it comes from ATUIN_SYNC_ADDRESS, exported by the
# global fnox config, rather than a sync_address here. Without fnox (the Linux
# hosts) nothing is logged in, so auto_sync has nothing to do. Never set
# sync_address = "": atuin 18.24 rejects it and `atuin init` fails.
#
# A machine joins with the shared key and password from fnox's `atuin` profile;
# see README.md (atuin sync).
auto_sync = true

# Search behavior
search_mode = "fuzzy"
filter_mode = "global"

# Show command exit status and duration in search results
show_preview = true
show_help = false

# Don't record zoxide jumps (z/zi), they clutter history
history_filter = ["^z ", "^zi "]

# Theme (file in ~/.config/atuin/themes/)
[theme]
name = "catppuccin-macchiato"
