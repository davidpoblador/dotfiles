# Local-only mode: no automatic sync, all history stays on disk. Leave
# sync_address unset: atuin 18.24 rejects an empty one and `atuin init` fails.
# To enable sync later: atuin register (or atuin login) and remove this line.
auto_sync = false

# Search behavior
search_mode = "fuzzy"
filter_mode = "global"

# Show command exit status and duration in search results
show_preview = true
show_help = false

# Don't record zoxide jumps (z/zi), they clutter history
history_filter = ["^z ", "^zi "]

# Theme (file in ~/.config/atuin/themes/)
[theme]
name = "catppuccin-macchiato"
